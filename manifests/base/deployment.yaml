apiVersion: apps/v1
kind: Deployment
metadata:
  name: urbangear-frontend
  namespace: default
  labels:
    app: urbangear-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: urbangear-frontend
  template:
    metadata:
      labels:
        app: urbangear-frontend
    spec:
      containers:
      - name: frontend
        image: 924612597584.dkr.ecr.us-east-1.amazonaws.com/urbangear-dev-frontend:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: urbangear-frontend-service
  namespace: default
  labels:
    app: urbangear-frontend
spec:
  selector:
    app: urbangear-frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urbangear-frontend-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    # HTTPS Configuration
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # Use ACM certificate - will be auto-discovered by domain name
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:924612597584:certificate/YOUR_CERT_ARN
  labels:
    app: urbangear-frontend
spec:
  rules:
  - host: urbangear.qzz.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: urbangear-frontend-service
            port:
              number: 80

