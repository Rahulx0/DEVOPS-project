# RBAC Role granting admin permissions in default namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin
  namespace: default
# Rules defining permissions for the role
rules:
  # Grant all permissions on all resources
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
# RoleBinding to bind admin role to admins group
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-binding
  namespace: default
# Subjects (users/groups) to bind the role to
subjects:
  # Bind to the 'admins' group
  - kind: Group
    name: admins
    apiGroup: rbac.authorization.k8s.io
# Reference to the role being bound
roleRef:
  kind: Role
  name: admin
  apiGroup: rbac.authorization.k8s.io

