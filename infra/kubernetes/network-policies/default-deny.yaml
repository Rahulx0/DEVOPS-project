# NetworkPolicy to deny all ingress to urbangear-frontend pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: default
# Spec defining the policy rules
spec:
  # Select pods with app=urbangear-frontend
  podSelector:
    matchLabels:
      app: urbangear-frontend
  # Policy types: Ingress
  policyTypes:
    - Ingress
  # Ingress rules (empty means deny all)
  ingress:
    # Sources allowed (empty)
    - from: []
      # Allowed ports
      ports:
        - protocol: TCP
          port: 80
---
# NetworkPolicy to deny all egress from urbangear-frontend pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress
  namespace: default
# Spec defining the policy rules
spec:
  # Select pods with app=urbangear-frontend
  podSelector:
    matchLabels:
      app: urbangear-frontend
  # Policy types: Egress
  policyTypes:
    - Egress
  # Egress rules (empty means deny all)
  egress:
    # Destinations allowed (empty)
    - to: []
      # Allowed ports
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
        - protocol: UDP
          port: 53
