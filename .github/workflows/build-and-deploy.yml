name: Build and Deploy

on:
  push:
    branches:
      - rahul
      - main
  pull_request:
    branches:
      - rahul
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'urbangear-dev-frontend' }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME || 'urbangear-dev-cluster' }}
  KUBE_NAMESPACE: default

jobs:
  setup-infrastructure:
    name: Setup AWS Infrastructure
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/rahul' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    outputs:
      cluster-exists: ${{ steps.check-cluster.outputs.exists }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if EKS cluster exists
        id: check-cluster
        run: |
          if aws eks describe-cluster --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ EKS cluster already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  EKS cluster does not exist, will create it"
          fi

      - name: Setup Terraform
        if: steps.check-cluster.outputs.exists == 'false'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        if: steps.check-cluster.outputs.exists == 'false'
        working-directory: ./infra/terraform/envs/dev
        run: terraform init

      - name: Terraform Apply
        if: steps.check-cluster.outputs.exists == 'false'
        working-directory: ./infra/terraform/envs/dev
        run: |
          terraform apply -auto-approve
          echo "✅ Infrastructure created"
          echo "Waiting 60 seconds for cluster to stabilize..."
          sleep 60

  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: setup-infrastructure
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
      image-uri: ${{ steps.image.outputs.uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if it doesn't exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --tags Key=Project,Value=urbangear Key=Environment,Value=dev Key=ManagedBy,Value=github-actions
          echo "✅ ECR repository ready"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name and tags
        id: prepare-image
        run: |
          # Fallback ECR repository if secret is empty (avoid creating tags like :<sha>)
          if [ -z "${{ env.ECR_REPOSITORY }}" ]; then
            echo "ECR_REPOSITORY is empty. Setting to 'urbangear-dev-frontend' as fallback." >&2
            echo "ECR_REPOSITORY=urbangear-dev-frontend" >> $GITHUB_ENV
          fi

          IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          TAG_SHA=$(echo "${GITHUB_SHA:-${{ github.sha }}}" | cut -c1-40)
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "TAG_SHA=$TAG_SHA" >> $GITHUB_ENV

      - name: Debug image variables
        run: |
          echo "Registry: ${{ steps.login-ecr.outputs.registry }}"
          echo "ECR_REPOSITORY: '${{ env.ECR_REPOSITORY }}'"
          echo "IMAGE: '${{ env.IMAGE }}'"
          echo "TAG_SHA: '${{ env.TAG_SHA }}'"

      - name: Build and push image to Amazon ECR
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG_SHA }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_NVIDIA_API_KEY=${{ secrets.VITE_NVIDIA_API_KEY }}

      - name: Set image metadata outputs
        id: image
        run: |
          echo "tag=${{ env.TAG_SHA }}" >> $GITHUB_OUTPUT
          echo "uri=${{ env.IMAGE }}:${{ env.TAG_SHA }}" >> $GITHUB_OUTPUT

      - name: Update deployment manifest
        run: |
          sed -i 's|924612597584.dkr.ecr.us-east-1.amazonaws.com/urbangear-dev-frontend:latest|${{ steps.image.outputs.uri }}|g' manifests/overlays/prod/deployment-patch.yaml

      - name: Commit updated manifest back to repo
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add manifests/overlays/prod/deployment-patch.yaml
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update image to ${{ steps.image.outputs.tag }}"
          git push origin rahul
        continue-on-error: true

      - name: Upload updated manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: manifests/overlays/prod/deployment-patch.yaml

  setup-alb-controller:
    name: Setup ALB Controller
    runs-on: ubuntu-latest
    needs: build
    if: (github.ref == 'refs/heads/rahul' || github.ref == 'refs/heads/main') && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Install AWS Load Balancer Controller
        run: |
          if ! helm list -n kube-system | grep -q aws-load-balancer-controller; then
            echo "Installing AWS Load Balancer Controller..."
            helm repo add eks https://aws.github.io/eks-charts
            helm repo update
            helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
              -n kube-system \
              --set clusterName=${{ env.EKS_CLUSTER_NAME }}
            echo "✅ AWS Load Balancer Controller installed"
            kubectl wait --for=condition=available --timeout=300s deployment/aws-load-balancer-controller -n kube-system
          else
            echo "✅ AWS Load Balancer Controller already installed"
          fi

  setup-argocd:
    name: Setup ArgoCD
    runs-on: ubuntu-latest
    needs: setup-alb-controller
    if: (github.ref == 'refs/heads/rahul' || github.ref == 'refs/heads/main') && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Install ArgoCD
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          echo "Waiting for ArgoCD server..."
          kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n argocd || true
          kubectl apply -f infra/argocd/application.yaml
          echo "✅ ArgoCD installed"

  setup-monitoring:
    name: Setup Monitoring
    runs-on: ubuntu-latest
    needs: setup-alb-controller
    if: (github.ref == 'refs/heads/rahul' || github.ref == 'refs/heads/main') && github.event_name == 'push'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Install Prometheus & Grafana
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            -n monitoring \
            --set alertmanager.enabled=false \
            --set prometheus.prometheusSpec.retention=1d \
            --set prometheus.prometheusSpec.resources.requests.cpu=50m \
            --set prometheus.prometheusSpec.resources.requests.memory=128Mi \
            --set grafana.resources.requests.cpu=25m \
            --set grafana.resources.requests.memory=64Mi \
            --wait --timeout=5m || true
          echo "✅ Monitoring installed"

  setup-security:
    name: Setup RBAC & Network Policies
    runs-on: ubuntu-latest
    needs: setup-alb-controller
    if: (github.ref == 'refs/heads/rahul' || github.ref == 'refs/heads/main') && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Apply RBAC Configuration
        run: |
          echo "Applying RBAC roles..."
          kubectl apply -f infra/kubernetes/rbac/developer-role.yaml
          kubectl apply -f infra/kubernetes/rbac/admin-role.yaml
          echo "✅ RBAC configured"

      - name: Apply Network Policies
        run: |
          echo "Applying Network Policies..."
          kubectl apply -f infra/kubernetes/network-policies/default-deny.yaml
          echo "✅ Network Policies configured"

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [setup-alb-controller, setup-security, setup-argocd, setup-monitoring]
    if: (github.ref == 'refs/heads/rahul' || github.ref == 'refs/heads/main') && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Download deployment manifest
        uses: actions/download-artifact@v4
        with:
          name: deployment-manifest
          path: manifests/overlays/prod

      - name: Deploy to Kubernetes
        run: |
          echo "Applying Kubernetes manifests..."
          
          # Delete old pending pods if any
          kubectl delete pods -l app=urbangear-frontend --field-selector=status.phase=Pending --ignore-not-found=true
          
          kubectl apply -k manifests/overlays/prod/
          
          echo "Current deployment status:"
          kubectl get deployment urbangear-frontend -n ${{ env.KUBE_NAMESPACE }} -o wide

      - name: Wait for deployment rollout
        run: |
          echo "Waiting for deployment to complete..."
          kubectl rollout status deployment/urbangear-frontend -n ${{ env.KUBE_NAMESPACE }} --timeout=3m || {
            echo "Rollout taking longer than expected, checking status..."
            kubectl get pods -l app=urbangear-frontend
            kubectl describe deployment urbangear-frontend | tail -20
          }
        continue-on-error: true

      - name: Get Application URL
        run: |
          echo "Waiting for ALB to be provisioned..."
          sleep 30
          ALB_URL=$(kubectl get ingress urbangear-frontend-ingress -n ${{ env.KUBE_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "ALB provisioning...")
          echo "=========================================="
          echo "✅ Deployment Complete!"
          echo "=========================================="
          echo "Application URL: http://${ALB_URL}"
          echo "=========================================="
          
      - name: Verify deployment
        run: |
          echo "Deployment status:"
          kubectl get deployment,pods,svc,ingress -n ${{ env.KUBE_NAMESPACE }}
        continue-on-error: true

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: deploy
    if: (github.ref == 'refs/heads/rahul' || github.ref == 'refs/heads/main') && github.event_name == 'push'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Display Complete Status
        run: |
          echo "=========================================="
          echo "🎉 Complete DevOps Stack Deployed!"
          echo "=========================================="
          echo ""
          echo "✅ Application Deployed"
          echo "✅ ALB Controller Running"
          echo "✅ ArgoCD Installed"
          echo "✅ Monitoring Stack (Prometheus + Grafana)"
          echo "✅ RBAC Configured"
          echo "✅ Network Policies Applied"
          echo ""
          echo "=========================================="
          echo "Access Points:"
          echo "=========================================="
          
          ALB_URL=$(kubectl get ingress urbangear-frontend-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "Provisioning...")
          echo "🌐 Application: http://${ALB_URL}"
          echo ""
          echo "🔄 ArgoCD: kubectl port-forward svc/argocd-server -n argocd 8080:443"
          ARGOCD_PASS=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" 2>/dev/null | base64 -d || echo "N/A")
          echo "   Username: admin | Password: ${ARGOCD_PASS}"
          echo ""
          echo "📊 Grafana: kubectl port-forward -n monitoring svc/prometheus-grafana 3000:80"
          echo "   Username: admin | Password: prom-operator"
          echo ""
          echo "=========================================="
          kubectl get pods -A | head -20
          echo "=========================================="

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd app && npm ci

      - name: Build application
        run: |
          cd app && npm run build

      - name: Run linter
        run: |
          cd app && npm run lint 2>/dev/null || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  sonarqube-analysis:
    name: SonarCloud Code Quality Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
          
      - name: Install dependencies
        working-directory: ./app
        run: npm ci
        
      - name: Run tests with coverage
        working-directory: ./app
        run: |
          npm run test:coverage
          echo "Coverage report generated:"
          ls -la coverage/
          head -50 coverage/lcov.info
          
      - name: Verify coverage file exists
        run: |
          if [ -f "app/coverage/lcov.info" ]; then
            echo "Coverage file found at app/coverage/lcov.info"
            wc -l app/coverage/lcov.info
          else
            echo "ERROR: Coverage file not found!"
            exit 1
          fi
          
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

