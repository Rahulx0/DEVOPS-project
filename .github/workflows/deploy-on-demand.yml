name: Deploy On-Demand

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - deploy
          - teardown
          - destroy-all

env:
  AWS_REGION: us-west-2
  PROJECT_NAME: urbangear
  ENVIRONMENT: dev

jobs:
  deploy:
    name: Deploy Infrastructure and Application
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'deploy'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Bootstrap Infrastructure
        run: |
          cd infra/terraform/envs/bootstrap
          terraform init
          terraform apply -auto-approve
          echo "BUCKET_NAME=$(terraform output -raw backend_bucket_name)" >> $GITHUB_ENV

      - name: Deploy Infrastructure
        run: |
          cd infra/terraform/envs/dev
          terraform init
          terraform plan -out=tfplan
          terraform apply tfplan
          echo "EKS_CLUSTER=$(terraform output -raw eks_cluster_name)" >> $GITHUB_ENV
          echo "ECR_REPO=$(terraform output -raw ecr_repository_url)" >> $GITHUB_ENV

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Wait for nodes
        run: |
          echo "Waiting for nodes to be ready..."
          kubectl wait --for=condition=Ready nodes --all --timeout=600s || kubectl get nodes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd app
          docker build -t ${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }} -t ${{ env.ECR_REPO }}:latest --target prod .
          docker push ${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REPO }}:latest

      - name: Deploy to Kubernetes
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd manifests/overlays/prod
          sed -i "s|image:.*|image: ${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}|g" deployment-patch.yaml
          kubectl apply -k .
          kubectl rollout status deployment/urbangear-frontend --timeout=300s || true

      - name: Get Application URL
        run: |
          echo "Waiting for LoadBalancer..."
          sleep 60
          LB_URL=$(kubectl get svc urbangear-frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
          echo "### 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Application URL:** http://$LB_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ env.EKS_CLUSTER }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Remember to run teardown workflow when done to save costs!**" >> $GITHUB_STEP_SUMMARY

  teardown:
    name: Teardown Demo Environment
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'teardown'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Cleanup Kubernetes resources
        run: |
          if aws eks describe-cluster --name urbangear-dev-cluster --region ${{ env.AWS_REGION }} &>/dev/null; then
            aws eks update-kubeconfig --name urbangear-dev-cluster --region ${{ env.AWS_REGION }} || true
            kubectl delete svc --all-namespaces --field-selector spec.type=LoadBalancer --ignore-not-found=true || true
            echo "Waiting for load balancers to be deleted..."
            sleep 30
          fi

      - name: Destroy Infrastructure
        run: |
          cd infra/terraform/envs/dev
          terraform init
          terraform destroy -auto-approve || {
            echo "Retrying destroy..."
            sleep 30
            terraform destroy -auto-approve
          }

      - name: Summary
        run: |
          echo "### ✅ Teardown Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Destroyed resources:**" >> $GITHUB_STEP_SUMMARY
          echo "- EKS Cluster and Node Groups" >> $GITHUB_STEP_SUMMARY
          echo "- VPC, Subnets, NAT Gateways" >> $GITHUB_STEP_SUMMARY
          echo "- Load Balancers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Kept resources (minimal cost):**" >> $GITHUB_STEP_SUMMARY
          echo "- S3 State Bucket (~\$0.023/month)" >> $GITHUB_STEP_SUMMARY
          echo "- DynamoDB Table (~\$0.25/month)" >> $GITHUB_STEP_SUMMARY
          echo "- ECR Repository (~\$0.10/GB/month)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💰 **Estimated savings: ~\$3-5/day**" >> $GITHUB_STEP_SUMMARY

  destroy-all:
    name: Destroy All Resources
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy-all'
    environment: 
      name: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Cleanup Kubernetes resources
        run: |
          if aws eks describe-cluster --name urbangear-dev-cluster --region ${{ env.AWS_REGION }} &>/dev/null; then
            aws eks update-kubeconfig --name urbangear-dev-cluster --region ${{ env.AWS_REGION }} || true
            kubectl delete svc --all-namespaces --field-selector spec.type=LoadBalancer --ignore-not-found=true || true
            sleep 30
          fi

      - name: Destroy Dev Infrastructure
        run: |
          cd infra/terraform/envs/dev
          terraform init
          terraform destroy -auto-approve || {
            sleep 30
            terraform destroy -auto-approve
          }

      - name: Destroy Bootstrap
        run: |
          cd infra/terraform/envs/bootstrap
          terraform init
          BUCKET_NAME=$(terraform output -raw s3_bucket_name 2>/dev/null || echo "")
          if [ -n "$BUCKET_NAME" ]; then
            echo "Emptying S3 bucket..."
            aws s3 rm s3://$BUCKET_NAME --recursive --region ${{ env.AWS_REGION }} || true
          fi
          terraform destroy -auto-approve

      - name: Summary
        run: |
          echo "### ✅ All Resources Destroyed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**All AWS resources have been deleted.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💰 **Your AWS costs should now be $0 for this project.**" >> $GITHUB_STEP_SUMMARY
