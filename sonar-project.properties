sonar.projectKey=Rahulx0_DEVOPS-project
sonar.organization=rahulx0
sonar.projectName=UrbanGear E-commerce Platform
sonar.projectVersion=1.0

# Source code location
sonar.sources=app/src
sonar.tests=app/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclude test files and setup from source analysis
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/*.min.js,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**

# Language-specific settings
sonar.typescript.lcov.reportPaths=app/coverage/lcov.info
sonar.javascript.lcov.reportPaths=app/coverage/lcov.info

# Code coverage exclusions
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/index.tsx,**/main.tsx,**/test/**,**/constants.tsx,**/vite-env.d.ts

# Encoding
sonar.sourceEncoding=UTF-8