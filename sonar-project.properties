# SonarQube Configuration for UrbanGear E-commerce
sonar.projectKey=RahulSharma_DEVOPS-project
sonar.organization=rahulsharma22446
sonar.projectName=UrbanGear E-commerce Platform
sonar.projectVersion=1.0

# Source code location
sonar.sources=app/src
sonar.tests=app/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclude files
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/*.min.js,**/coverage/**

# Language-specific settings
sonar.typescript.lcov.reportPaths=app/coverage/lcov.info
sonar.javascript.lcov.reportPaths=app/coverage/lcov.info

# Code coverage
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/index.tsx,**/main.tsx

# Encoding
sonar.sourceEncoding=UTF-8